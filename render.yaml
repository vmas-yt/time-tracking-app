databases:
  - name: time-tracking-db
    plan: free
    databaseName: time_tracking
    user: time_tracking

services:
  - type: web
    name: time-tracking-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: time-tracking-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_EXTRA_ORIGIN_HOST
        fromService:
          type: web
          name: time-tracking-frontend
          property: host

  - type: web
    name: time-tracking-frontend
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start -- -p $PORT
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: time-tracking-backend
          property: host
